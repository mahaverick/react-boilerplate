name: CI

on:
  # Every PR, whatever its base, so a stacked PR already carries the
  # required checks when GitHub retargets it to main.
  pull_request:
  # Called by deploy.yml as the gate before an image is built. `push: main`
  # lives in deploy.yml, so main isn't tested twice.
  workflow_call:
  workflow_dispatch:

# PR runs are grouped per PR, and a newer push cancels the older run.
# Push and dispatch runs, including deploy.yml's call, are grouped per commit,
# so no commit's gate is ever dropped.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Jobs: lint (static gate, build, bundle check, audits), unit (four test
  # shards) then test (merges the shards, enforces coverage), e2e, and image
  # then image-checks and two nginx-e2e shards then docker (requires all of
  # them). lint, unit, e2e and image start in parallel. Actions are pinned
  # to commit SHAs, and Renovate keeps the pins current. actions/cache and
  # actions/upload-artifact need an Actions Runner of at least 2.327.1, which
  # matters only for self-hosted runners; these jobs run on ubuntu-latest.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-vp installs Vite+, Node and the pnpm that packageManager names.
      # run-install is off so the install below stays `--frozen-lockfile`,
      # with hooks disabled.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
          VP_GIT_HOOKS: '0'
      # pnpm check is vp check (Oxfmt, Oxlint with type-aware rules) plus the
      # untyped leftover ESLint, zero warnings.
      - run: pnpm check
      - run: pnpm lint:docs
      # Each vendored src/components/ui file against its committed registry
      # snapshot plus the edits docs/ui-local-edits.md records. Offline.
      - run: pnpm ui:drift
      # Unused files, exports, types and dependencies; knip.jsonc says why
      # each ignored finding is not dead code.
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm build
      # A second, in-memory build: fails on a single JS chunk, first-visit JS
      # over budget, or a devtools module in any chunk.
      - run: pnpm check:bundle
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
      # Dev tooling never ships, so its advisories warn instead of failing the
      # build; a critical one still shows on the run as a failed, allowed step.
      # Reviewed ones sit in pnpm-workspace.yaml's auditConfig.
      - name: Audit all dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level critical

  # The unit suite in four shards. Each writes a blob report and a coverage
  # fragment, with no threshold: a shard sees part of the suite.
  # tests/unit/a11y.test.tsx runs in one of them, which is what makes the
  # accessibility criteria a gate rather than an aspiration.
  unit:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
          VP_GIT_HOOKS: '0'
      - run: pnpm test:shard --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The required `test` check: merges the shards' reports and enforces the
  # coverage thresholds on the whole suite.
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every unit shard
        if: needs.unit.result != 'success'
        run: |
          echo "A unit shard failed or was cancelled; see the unit jobs."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
          VP_GIT_HOOKS: '0'
      # GitHub's artifact service sometimes answers 503 (ServerBusy). The first
      # download may fail; the second runs only then, after a pause. If it fails
      # too, the job fails. The test job's `needs` gate already ran above, so a
      # failed shard never reaches here.
      - name: Download the test blobs
        id: blobs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-*
          path: .vitest/
          merge-multiple: true
      - name: Wait before retrying the download
        if: steps.blobs.outcome == 'failure'
        run: sleep 20
      - name: Download the test blobs (retry)
        if: steps.blobs.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-*
          path: .vitest/
          merge-multiple: true
      - run: pnpm test:merge

  # The `fixtures` Playwright project, on four workers.
  #
  # It drives the MSW harness in e2e/harness/, so it needs a built preview and
  # nothing else — `pnpm test:e2e` sets E2E_BUNDLED, and playwright.config.ts's
  # `webServer` builds the harness (e2e/harness.vite.config.ts) and serves it
  # with `vp preview`. `reuseExistingServer` is off, so it always gets a clean boot.
  # Each test gets its own page, so the tests run in parallel.
  #
  # The `nginx` tests tagged `@no-api` run in the `nginx-e2e` shards, against
  # the image the `image` job builds.
  #
  # `live`, and the `nginx` tests that need an API, are not here: they need a
  # real express-boilerplate plus postgres, redis and mailpit, and register
  # accounts through the verification email. e2e-nightly.yml runs both
  # projects against express's main every night and on demand; locally they
  # are `pnpm test:e2e:live` and `pnpm test:e2e:nginx`.
  #
  # This job exists because the checks it makes are the ones jsdom cannot:
  # jsdom has no layout and no cascade, so "the webfont actually loaded",
  # "nothing overflows the viewport at 390px" and "the empty state renders as
  # more than a bare table header" are all invisible to `pnpm test`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
          VP_GIT_HOOKS: '0'
      - id: pw
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          if [ -z "$version" ]; then echo "::error::could not read the Playwright version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The browser is ~100MB and is not in the pnpm store. Keyed on the
      # Playwright version, not the lockfile: a lockfile hash misses on every
      # dependency bump, while a new browser build is needed only when
      # Playwright itself moves. e2e-nightly.yml uses the same key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--with-deps` installs the system libraries Chromium needs, through
      # apt, which is slow and sometimes stalls for minutes. ubuntu-latest
      # already has them, so a cache hit installs nothing.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm test:e2e
      # Only on failure, and only for a week: the report is how you find out
      # what a red run actually saw, and it is useless once the branch moves on.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          # A re-run of a failed e2e job uploads under the same name.
          overwrite: true

  # The image and its nginx template, checked before deploy rather than at it —
  # a broken proxy_pass or a typo'd directive would otherwise surface there.
  # Four jobs, so the image's checks and its Playwright tests do not queue
  # behind each other: `image` builds it and uploads it as an artifact,
  # `image-checks` and two `nginx-e2e` shards each download it, and `docker`,
  # the required check, fails unless all of them passed. The artifact name is
  # fixed, so "Re-run failed jobs" on a red shard or check reuses the image the
  # first attempt built: every attempt builds the same commit.
  #
  # `image` builds the image (never pushed: deploy.yml does that) with no
  # source map variable and no secret, as a fork or a fresh repo does, so the
  # upload is skipped; the Dockerfile itself fails if .git reaches the build
  # context.
  #
  # The build has no layer cache. On a source change, pulling the cached
  # dependency layer (about 210 MB) from the GitHub Actions cache and
  # extracting it took about 50 s, while `pnpm install` from the registry
  # takes about 11 s, and exporting the cache took 12 to 44 s more. A
  # from-scratch build is about 35 s. deploy.yml keeps its own cache.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build summary and its record artifact, and removing the builder at
      # the end, add about 9 s to a job nothing reads them in.
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      # The limit stops a stalled registry from holding the job. The image is
      # written as a docker archive for the jobs that test it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 5
        with:
          context: .
          tags: react-boilerplate:ci
          build-args: GIT_SHA=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The image's checks: the default render passes `nginx -t`, a custom
  # API_UPSTREAM renders without touching nginx's own variables, and
  # docker/check-image.sh passes: uid 101 on 8080, a read-only root,
  # API_UPSTREAM validation, the security headers on pages, assets and a 404,
  # a real 404 for a missing asset, no source map anywhere, chunk ids injected
  # with no release id, and this commit's sha baked in as the release.
  image-checks:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      # `nginx -t` inside the built image. nginx resolves `api` when it LOADS
      # the config, so the hostname has to exist for the parse to succeed —
      # the same reason running this image standalone needs `--add-host`.
      - run: docker run --rm --add-host=api:127.0.0.1 react-boilerplate:ci nginx -t
      # The entrypoint renders nginx.conf with envsubst, limited by
      # NGINX_ENVSUBST_FILTER to API_UPSTREAM. The lowercase `host`, `scheme`,
      # `uri`, `cache_control`, `forwarded_proto` and `http_x_forwarded_proto`
      # collide with nginx's own variables: without the filter envsubst
      # replaces them, and the checks below fail.
      - name: Render with a custom API_UPSTREAM
        run: |
          docker run --rm --add-host=example:127.0.0.1 \
            -e API_UPSTREAM=http://example:1234 \
            -e host=clobbered -e scheme=clobbered -e uri=clobbered -e cache_control=clobbered \
            -e forwarded_proto=clobbered -e http_x_forwarded_proto=clobbered \
            react-boilerplate:ci nginx -T > rendered.conf 2>&1 || { cat rendered.conf; exit 1; }
          fail=0
          expect() {
            n=$(grep -cF -- "$2" rendered.conf || true)
            if [ "$n" != "$1" ]; then echo "expected $1 of: $2 (found $n)"; fail=1; fi
          }
          # Counts directive lines only, so a comment that names the directive
          # does not count.
          expect_directive() {
            n=$(grep -cE -- "^\s*$2" rendered.conf || true)
            if [ "$n" != "$1" ]; then echo "expected $1 directive(s): $2 (found $n)"; fail=1; fi
          }
          expect 4 'proxy_pass http://example:1234;'
          expect_directive 4 'proxy_pass '
          expect 4 "proxy_set_header Host \$host;"
          expect 4 "proxy_set_header X-Forwarded-Proto \$forwarded_proto;"
          # The notification stream's and the Google OAuth callback's locations.
          expect_directive 2 'error_log /var/log/nginx/error\.log crit;'
          expect_directive 1 'client_max_body_size 10m;'
          expect_directive 1 'proxy_request_buffering off;'
          expect_directive 1 'alias /tmp/runtime/runtime-config\.js;'
          expect 1 "add_header Cache-Control \$cache_control;"
          expect 0 "add_header Cache-Control \$cache_control always;"
          expect 1 "try_files \$uri =404;"
          expect 1 "try_files \$uri /index.html;"
          expect 0 'clobbered'
          expect 0 'API_UPSTREAM}'
          expect_directive 1 'listen 8080;'
          expect 1 '# configuration file /tmp/nginx/conf.d/default.conf:'
          expect_directive 1 'include /tmp/nginx/conf\.d/\*\.conf;'
          expect_directive 1 'server_tokens off;'
          expect_directive 1 'add_header Content-Security-Policy '
          expect_directive 1 'add_header Permissions-Policy '
          if [ "$fail" != 0 ]; then cat rendered.conf; exit 1; fi
      # The image from outside, the way it ships. docker/check-image.sh says
      # what it checks; run it locally with the same command.
      - run: bash docker/check-image.sh react-boilerplate:ci 18080 "$GIT_SHA"
        env:
          GIT_SHA: ${{ github.sha }}

  # The `nginx` Playwright tests tagged `@no-api`, in two shards, against the
  # image `image` built, started as it ships (read-only root, a tmpfs /tmp)
  # with nothing listening behind /api, so every API call answers 502. They
  # check what only the real bundle behind the real nginx.conf shows: the
  # security headers, the enforced Content-Security-Policy, the pre-paint theme
  # script, the run-time configuration, and posthog-js's replay under that
  # policy with no probe value reaching a fake PostHog. The rest of `nginx`
  # needs a live API and runs in e2e-nightly.yml, or locally with
  # `pnpm test:e2e:nginx`.
  nginx-e2e:
    name: nginx-e2e (${{ matrix.shard }}/2)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
          VP_GIT_HOOKS: '0'
      - id: pw
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          if [ -z "$version" ]; then echo "::error::could not read the Playwright version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      # `api` resolves to the container's own loopback, where nothing listens.
      # The run-time settings are what a deployment passes (plain environment
      # variables), so the bundle under test loads posthog-js as a keyed
      # deployment does; e2e/nginx/analytics.test.ts expects these values.
      - name: Start the image with no API behind it
        run: |
          docker run -d --name rb-e2e -p 8088:8080 --read-only --tmpfs /tmp \
            --add-host=api:127.0.0.1 -e API_UPSTREAM=http://api:4040 \
            -e POSTHOG_KEY=phc_test_key_not_real -e APP_ENVIRONMENT=ci \
            -e ANALYTICS_HANDOFF_ORIGINS=https://www.example.test react-boilerplate:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8088/ && exit 0
            sleep 1
          done
          docker logs rb-e2e
          exit 1
      # E2E_NGINX stops playwright.config.ts starting the dev server. The
      # shards split the tests by count, in file order: the first holds the
      # analytics tests, whose longest test (about 32 s) bounds it.
      - run: pnpm exec playwright test --project=nginx --grep @no-api --shard=${{ matrix.shard }}/2
        env:
          E2E_NGINX: '1'
          # errors.test.ts expects the release the image was built with.
          E2E_RELEASE: ${{ github.sha }}
      - if: failure()
        run: docker logs rb-e2e 2>&1 | tail -n 100 || true
      # Only on failure, and only for a week: the report is how you find out
      # what a red run actually saw, and it is useless once the branch moves on.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-nginx-${{ matrix.shard }}
          path: playwright-report/
          # A re-run of a failed shard replaces the first attempt's report.
          overwrite: true
          retention-days: 7
      - if: always()
        run: docker rm -f rb-e2e >/dev/null 2>&1 || true

  # The required `docker` check: green only when image, image-checks and both
  # nginx-e2e shards passed. `always()` so a failed, cancelled or skipped part
  # still reports here as a failure instead of a skip.
  docker:
    needs: [image, image-checks, nginx-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require image, image-checks and every nginx-e2e shard
        env:
          IMAGE: ${{ needs.image.result }}
          IMAGE_CHECKS: ${{ needs.image-checks.result }}
          NGINX_E2E: ${{ needs.nginx-e2e.result }}
        run: |
          echo "image: $IMAGE, image-checks: $IMAGE_CHECKS, nginx-e2e: $NGINX_E2E"
          if [ "$IMAGE" != success ] || [ "$IMAGE_CHECKS" != success ] || [ "$NGINX_E2E" != success ]; then
            echo "A part of the docker check failed or was cancelled; see the image, image-checks and nginx-e2e jobs."
            exit 1
          fi
