name: CI

on:
  # Every PR, whatever its base, so a stacked PR already carries the
  # required checks when GitHub retargets it to main.
  pull_request:
  # Called by deploy.yml as the gate before an image is built. `push: main`
  # lives in deploy.yml now, so main isn't tested twice.
  workflow_call:
  workflow_dispatch:

# PR runs are grouped per PR, and a newer push cancels the older run.
# Push and dispatch runs, including deploy.yml's call, are grouped per commit,
# so no commit's gate is ever dropped.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Four parallel jobs: lint, test, e2e and docker. lint and test split the
  # way express-boilerplate's do. Action majors are the ones current at the
  # time of writing, checked against each action's latest release rather
  # than copied from anywhere. Verified 2026-09-22:
  # actions/checkout v7, pnpm/action-setup v6, actions/setup-node v7,
  # actions/cache v6, actions/upload-artifact v7.
  #
  # cache and upload-artifact were pinned a major or more behind when the e2e
  # job was added, and the runner said so: both still targeted Node 20, which
  # GitHub has deprecated, and were being force-run on Node 24. Their v5+
  # releases are that runtime move plus a port to ESM — no input changed, so
  # `path`/`key`/`cache-hit` and `name`/`path`/`retention-days` all still mean
  # what they did. Both require an Actions Runner of at least 2.327.1, which
  # matters only for self-hosted runners; these jobs run on ubuntu-latest.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # BEFORE setup-node, not after: `cache: pnpm` needs the pnpm binary on
      # PATH to resolve the store directory, and fails the job without it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` runs eslint AND `prettier --check`; formatting drift fails
      # CI as loudly as a lint error does. `--max-warnings 0` is the gate the
      # eslint half is held to.
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # This runs tests/unit/a11y.test.tsx with the rest, which is what makes
      # the accessibility criteria a gate rather than an aspiration.
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  # The `fixtures` Playwright project ONLY. It drives the MSW harness in
  # e2e/harness/, so it needs the dev server and nothing else —
  # playwright.config.ts's `webServer` starts one, and `reuseExistingServer` is
  # off under CI so it always gets a clean boot.
  #
  # `live` is deliberately NOT here. It needs a real express-boilerplate plus
  # postgres, redis and mailpit, and registers accounts through the verification
  # email; that is a service-container job of its own, not a flag on this one.
  # It stays opt-in behind `E2E_LIVE=1` (`pnpm test:e2e:live`).
  #
  # This job exists because the checks it makes are the ones jsdom cannot:
  # jsdom has no layout and no cascade, so "the webfont actually loaded",
  # "nothing overflows the viewport at 390px" and "the empty state renders as
  # more than a bare table header" are all invisible to `pnpm test`. Each of
  # those three was a real defect found by looking at a screenshot.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The browser is ~100MB and is not in the pnpm store, so setup-node's
      # cache does not cover it. Keyed on the lockfile: a Playwright bump
      # changes the lockfile and must fetch a matching browser build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # `--with-deps` installs the system libraries the browser needs, which a
      # bare runner does not have. On a cache hit only those are needed; the
      # browser binary is already there.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm test:e2e
      # Only on failure, and only for a week: the report is how you find out
      # what a red run actually saw, and it is useless once the branch moves on.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The image and its nginx template are exercised by nothing else — a broken
  # proxy_pass or a typo'd directive would otherwise surface at deploy time.
  # Built, never pushed (deploy.yml does that): this job proves the image
  # builds, the default render passes `nginx -t`, and a custom API_UPSTREAM
  # renders without touching nginx's own variables.
  #
  # Plain `docker` rather than docker/build-push-action, so this adds no action
  # pins to keep current. The runner ships with docker already.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t react-boilerplate:ci .
      # `nginx -t` inside the built image. nginx resolves `api` when it LOADS
      # the config, so the hostname has to exist for the parse to succeed —
      # the same reason running this image standalone needs `--add-host`.
      - run: docker run --rm --add-host=api:127.0.0.1 react-boilerplate:ci nginx -t
      # The entrypoint renders nginx.conf with envsubst, limited by
      # NGINX_ENVSUBST_FILTER to API_UPSTREAM. The lowercase `host`, `scheme`,
      # `uri`, `cache_control`, `forwarded_proto` and `http_x_forwarded_proto`
      # collide with nginx's own variables: without the filter envsubst
      # replaces them, and the checks below fail.
      - name: Render with a custom API_UPSTREAM
        run: |
          docker run --rm --add-host=example:127.0.0.1 \
            -e API_UPSTREAM=http://example:1234 \
            -e host=clobbered -e scheme=clobbered -e uri=clobbered -e cache_control=clobbered \
            -e forwarded_proto=clobbered -e http_x_forwarded_proto=clobbered \
            react-boilerplate:ci nginx -T > rendered.conf 2>&1 || { cat rendered.conf; exit 1; }
          fail=0
          expect() {
            n=$(grep -cF -- "$2" rendered.conf || true)
            if [ "$n" != "$1" ]; then echo "expected $1 of: $2 (found $n)"; fail=1; fi
          }
          # Counts directive lines only, so a comment that names the directive
          # does not count.
          expect_directive() {
            n=$(grep -cE -- "^\s*$2" rendered.conf || true)
            if [ "$n" != "$1" ]; then echo "expected $1 directive(s): $2 (found $n)"; fail=1; fi
          }
          expect 2 'proxy_pass http://example:1234;'
          expect_directive 2 'proxy_pass '
          expect 2 "proxy_set_header Host \$host;"
          expect 2 "proxy_set_header X-Forwarded-Proto \$forwarded_proto;"
          expect 1 "add_header Cache-Control \$cache_control always;"
          expect 1 "try_files \$uri /index.html;"
          expect 0 'clobbered'
          expect 0 'API_UPSTREAM}'
          if [ "$fail" != 0 ]; then cat rendered.conf; exit 1; fi
