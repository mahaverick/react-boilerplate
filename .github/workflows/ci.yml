name: CI

on:
  pull_request:
    branches: [main]
  # Called by deploy.yml as the gate before an image is built. `push: main`
  # lives in deploy.yml now, so main isn't tested twice.
  workflow_call:
  workflow_dispatch:

# Keyed on the event, NOT github.workflow: when deploy.yml calls this file,
# github.workflow is the CALLER's name, and concurrency group names are
# case-insensitive — "Deploy-refs/heads/main" would collide with deploy.yml's
# own "deploy-refs/heads/main" group. Only PR runs are cancelled by a newer
# push; a gate run on main is never killed half-way.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Two parallel jobs, matching express-boilerplate's split. Action majors are
  # the ones current at the time of writing, checked against each action's
  # latest release rather than copied from anywhere. Verified 2026-09-22:
  # actions/checkout v7, pnpm/action-setup v6, actions/setup-node v7,
  # actions/cache v6, actions/upload-artifact v7.
  #
  # cache and upload-artifact were pinned a major or more behind when the e2e
  # job was added, and the runner said so: both still targeted Node 20, which
  # GitHub has deprecated, and were being force-run on Node 24. Their v5+
  # releases are that runtime move plus a port to ESM — no input changed, so
  # `path`/`key`/`cache-hit` and `name`/`path`/`retention-days` all still mean
  # what they did. Both require an Actions Runner of at least 2.327.1, which
  # matters only for self-hosted runners; these jobs run on ubuntu-latest.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # BEFORE setup-node, not after: `cache: pnpm` needs the pnpm binary on
      # PATH to resolve the store directory, and fails the job without it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` runs eslint AND `prettier --check`; formatting drift fails
      # CI as loudly as a lint error does. `--max-warnings 0` is the gate the
      # eslint half is held to.
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # This runs src/tests/a11y.test.tsx with the rest, which is what makes
      # the accessibility criteria a gate rather than an aspiration.
      - run: pnpm test
      - run: pnpm build

  # The `fixtures` Playwright project ONLY. It drives the MSW harness in
  # e2e/harness/, so it needs the dev server and nothing else —
  # playwright.config.ts's `webServer` starts one, and `reuseExistingServer` is
  # off under CI so it always gets a clean boot.
  #
  # `live` is deliberately NOT here. It needs a real express-boilerplate plus
  # postgres, redis and mailpit, and registers accounts through the verification
  # email; that is a service-container job of its own, not a flag on this one.
  # It stays opt-in behind `E2E_LIVE=1` (`pnpm test:e2e:live`).
  #
  # This job exists because the checks it makes are the ones jsdom cannot:
  # jsdom has no layout and no cascade, so "the webfont actually loaded",
  # "nothing overflows the viewport at 390px" and "the empty state renders as
  # more than a bare table header" are all invisible to `pnpm test`. Each of
  # those three was a real defect found by looking at a screenshot.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The browser is ~100MB and is not in the pnpm store, so setup-node's
      # cache does not cover it. Keyed on the lockfile: a Playwright bump
      # changes the lockfile and must fetch a matching browser build.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # `--with-deps` installs the system libraries the browser needs, which a
      # bare runner does not have. On a cache hit only those are needed; the
      # browser binary is already there.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm test:e2e
      # Only on failure, and only for a week: the report is how you find out
      # what a red run actually saw, and it is useless once the branch moves on.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A third job the brief did not ask for. The image and its nginx config are
  # half of this task's deliverable and neither is exercised by lint, typecheck
  # or the test suite — a broken proxy_pass or a typo'd directive would
  # otherwise surface at deploy time. Built, never pushed: this job only proves
  # the image builds and `nginx -t` passes — the image is built and pushed in
  # deploy.yml.
  #
  # Plain `docker` rather than docker/build-push-action, so this adds no action
  # pins to keep current. The runner ships with docker already.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t react-boilerplate:ci .
      # `nginx -t` inside the built image. nginx resolves `api` when it LOADS
      # the config, so the hostname has to exist for the parse to succeed —
      # the same reason running this image standalone needs `--add-host`.
      - run: docker run --rm --add-host=api:127.0.0.1 react-boilerplate:ci nginx -t
