# The image's own /etc/nginx/nginx.conf, except for the last include: the
# server config is read from /tmp, where the entrypoint renders nginx.conf's
# template, so the root filesystem can be mounted read-only. The pid file and
# every temp path were already under /tmp. /tmp must be writable.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    # The same directory as NGINX_ENVSUBST_OUTPUT_DIR in the Dockerfile.
    include /tmp/nginx/conf.d/*.conf;
}
