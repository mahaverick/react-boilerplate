# The image's own /etc/nginx/nginx.conf, except for the last include: the
# server config is read from /tmp, where the entrypoint renders nginx.conf's
# template, so the root filesystem can be mounted read-only. The pid file and
# every temp path are under /tmp. /tmp must be writable.

worker_processes  auto;
# Two descriptors per connection slot, plus slack for files being served.
# The image's own limit is usually far higher; this keeps nginx independent
# of a runtime that starts containers with a low soft limit.
worker_rlimit_nofile  20000;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    # Per worker. Each notification stream holds two connections (the
    # browser's and the one to the API) for as long as the tab is open.
    # express refuses streams over its own caps: 5 per user (429
    # too_many_streams) and SSE_MAX_STREAMS_TOTAL per process (default 2000;
    # 503 stream_capacity with Retry-After: 30, which the client retries
    # quietly). nginx running out is NOT quiet: it stops answering new
    # connections, pages and API calls included ("worker_connections are not
    # enough"). So size this for every stream landing in one worker:
    #   2 x SSE_MAX_STREAMS_TOTAL x (express processes behind API_UPSTREAM)
    #   + headroom for pages, API calls and keep-alives.
    # 8192 holds one process at the default cap with about 4000 to spare.
    # Raise it with the whole fleet's stream total, not one process's. Each
    # slot costs about 0.45 KB per worker, used or not.
    # No per-IP `limit_conn`: TLS terminates in front of this container, so
    # every request shares the terminator's address.
    worker_connections  8192;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    # The same directory as NGINX_ENVSUBST_OUTPUT_DIR in the Dockerfile.
    include /tmp/nginx/conf.d/*.conf;
}
