# The image's own /etc/nginx/nginx.conf with three changes: the last include
# reads the server config from /tmp, where the entrypoint renders nginx.conf's
# template, so the root filesystem can be read-only; and worker_rlimit_nofile
# and worker_connections are set below. The pid file and every temp path are
# under /tmp, which must be writable.

worker_processes  auto;
# Two descriptors per connection slot, plus slack for files being served.
# Set here so nginx does not depend on a runtime that starts containers with a
# low soft limit.
worker_rlimit_nofile  20000;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    # Per worker. Each notification stream holds two connections (the
    # browser's and the one to the API) while its tab is open. Past
    # SSE_MAX_STREAMS_TOTAL per process (default 2000) express answers 503
    # stream_capacity, which the client retries quietly; nginx running out of
    # connections is not quiet: it stops answering new ones, pages and API
    # calls included ("worker_connections are not enough"). So size this for
    # every stream landing in one worker:
    #   2 x SSE_MAX_STREAMS_TOTAL x (express processes behind API_UPSTREAM)
    #   + headroom for pages, API calls and keep-alives.
    # 8192 holds one process at the default cap with about 4000 to spare.
    # Raise it with the whole fleet's stream total, not one process's. Every
    # slot costs memory in each worker, used or not.
    # No per-IP `limit_conn`: TLS terminates in front of this container, so
    # every request shares the terminator's address.
    worker_connections  8192;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    # The same directory as NGINX_ENVSUBST_OUTPUT_DIR in the Dockerfile.
    include /tmp/nginx/conf.d/*.conf;
}
