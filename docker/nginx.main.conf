# The image's own /etc/nginx/nginx.conf, except for the last include: the
# server config is read from /tmp, where the entrypoint renders nginx.conf's
# template, so the root filesystem can be mounted read-only. The pid file and
# every temp path are under /tmp. /tmp must be writable.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    # Per worker. Each notification stream holds two connections (the
    # browser's and the one to the API) for as long as the tab is open, so
    # the stock 1024 caps a worker at about 500 streams. express caps the
    # streams it holds: 5 per user (the 6th gets 429 too_many_streams) and
    # 2000 per process (SSE_MAX_STREAMS_TOTAL; the next gets 503
    # stream_capacity with Retry-After: 30, and the client backs off and
    # retries). 2000 streams cost nginx 4000 connections, so 4096 holds a
    # whole express process's streams even if one worker takes them all, and
    # express's refusal, not nginx's, is what a stream over the cap meets.
    # Raise this with SSE_MAX_STREAMS_TOTAL, or when one nginx fronts more
    # than one express process.
    # No per-IP `limit_conn`: TLS terminates in front of this container, so
    # every request shares the terminator's address.
    worker_connections  4096;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    # The same directory as NGINX_ENVSUBST_OUTPUT_DIR in the Dockerfile.
    include /tmp/nginx/conf.d/*.conf;
}
