# The container's only server block. It is copied to
# /etc/nginx/conf.d/default.conf, which the stock nginx.conf includes from
# inside `http { }` — so `log_format` and `map` are legal at the top of this
# file, and `server` sits directly in `http`.

# Strips the query string from the logged request line. Applied to the SSE
# location only, where the query carries an access token.
log_format stream_nolog '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

# The cache policy, chosen by URI HERE rather than by a per-location
# `add_header` — and that is the whole point of this map, not a flourish.
#
# NGINX FOOTGUN: `add_header` does NOT inherit into a location block that
# declares any `add_header` of its own. The obvious shape for this file — a
# `location /assets/` and a `location = /index.html` that each set
# Cache-Control — would therefore silently DROP every security header set on
# the server block below, on exactly the responses a browser caches longest.
# Nothing warns; `nginx -t` passes; only a response says so.
#
# So no location in this file declares an `add_header` at all. The cache value
# is computed here, one `add_header Cache-Control` sits on the server block
# with the rest, and inheritance is never in play. Check that with `curl -I` on
# a real asset, not by reading this file.
#
# An EMPTY value makes nginx skip the header entirely. That is what keeps a
# proxied /api/ response carrying the backend's own Cache-Control rather than a
# second, contradictory one added by us.
map $uri $cache_control {
  default      '';
  ~^/assets/   'public, max-age=31536000, immutable';
  /index.html  'no-store';
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers. `always` so they are set on error responses too, not
  # only on 2xx/3xx. See the map above for why they live only here.
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $cache_control always;
  # HSTS is deliberately NOT set here: this server listens on :80 behind a TLS
  # terminator, and a max-age sent over plain HTTP is ignored by browsers while
  # being actively wrong if this ever runs without TLS in front. Set it at the
  # edge that terminates TLS.
  #
  # Content-Security-Policy is deliberately absent too, and that is a KNOWN
  # GAP rather than an oversight — see the CSP section of README.md. index.html
  # carries the inline pre-paint theme script, which must run before the bundle
  # or every dark-mode load flashes light. `script-src 'self'` blocks it and
  # `'unsafe-inline'` gives away the protection the header exists for, so the
  # honest fix is a SHA-256 hash of that exact script emitted by a build step.
  # Shipping a guessed policy would be worse than shipping none.

  # SSE. Must come BEFORE the general /api/ block. nginx buffers responses by
  # default, which stalls an event stream indefinitely.
  location /api/v1/notifications/stream {
    # The access token rides in the QUERY STRING here, because the backend
    # requires it: requireAuth reads only a Bearer header and EventSource
    # cannot set one, so this route authenticates from `?token=` itself
    # (notification.routes.ts' header comment). That is not ours to change in
    # Phase A — but logging it IS. The default access-log format records the
    # full request line, which would write a live 15-minute access token into
    # access.log on every connect AND every reconnect, and the client hook
    # reconnects under backoff. Log this location without its query string.
    access_log /var/log/nginx/access.log stream_nolog;
    # The ERROR log is the second half of that leak, and a custom format
    # cannot fix it: nginx writes the full request line AND the full upstream
    # URL into every `connect() failed` message, query string included. That
    # is measured, not assumed — a 502 here logged
    # `request: "GET /api/v1/notifications/stream?token=… HTTP/1.1"` before
    # this line was added. And a backend that is down is precisely when the
    # client reconnects under backoff, so the token would be written again and
    # again. `crit` keeps genuinely fatal messages while dropping the
    # `error`-level upstream ones; the access_log above still records every
    # request and its status, so a failing stream is still visible — just
    # without the "(111: Connection refused)" detail.
    error_log /var/log/nginx/error.log crit;
    proxy_pass http://api:4040;
    proxy_http_version 1.1;
    # Not "keep-alive" and not "upgrade": an empty Connection header is what
    # stops nginx passing the client's hop-by-hop value upstream and closing
    # the stream.
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  location /api/ {
    # NO trailing path on proxy_pass. Adding one — even a bare "/" — makes
    # nginx REWRITE the URI, which changes the path the browser scopes the
    # refresh cookie to (it is set with Path=/api/v1/auth) and silently breaks
    # token refresh: the cookie simply stops being sent, with no error
    # anywhere.
    proxy_pass http://api:4040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Express reads this for its `secure` cookie flag and TRUST_PROXY. Without
    # it, a cookie set behind TLS termination is issued without `secure`.
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    # The SPA fallback. After the internal redirect, $uri is /index.html, so
    # the map above gives every client-side route `no-store` — a cached
    # index.html is how a deploy leaves browsers asking for asset hashes that
    # no longer exist.
    try_files $uri /index.html;
  }
}
