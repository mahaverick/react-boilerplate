# The container's only server block, and a TEMPLATE. The Dockerfile copies it
# to /etc/nginx/templates/default.conf.template; the image's entrypoint renders
# it with envsubst into /tmp/nginx/conf.d/default.conf on every start, so the
# root filesystem can stay read-only. Only API_UPSTREAM is substituted:
# NGINX_ENVSUBST_FILTER in the Dockerfile limits envsubst to that one name, so
# nginx's own variables pass through untouched.
# A new placeholder here needs that filter widened too. Otherwise it reaches
# nginx unrendered, nginx reads `${NAME}` as one of its own variables, and
# `nginx -t` fails with `unknown "NAME" variable`.
#
# docker/nginx.main.conf includes the rendered file from inside `http { }` — so
# `log_format` and `map` are legal at the top of this file, and `server` sits
# directly in `http`.

# One shared format that strips the query string from the logged request
# line. Applied at SERVER level below (ACTIVE protection for the one-time
# tokens `/reset-password?token=` and `/verify-email?token=` carry, see that
# `access_log` line's own comment) and again on the SSE location (defence in
# depth only: the stream's credential travels in a header, not the query
# string — see that location's own comment).
log_format stream_nolog '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

# The cache policy, chosen by URI HERE rather than by a per-location
# `add_header` — and that is the whole point of this map, not a flourish.
#
# NGINX FOOTGUN: `add_header` does NOT inherit into a location block that
# declares any `add_header` of its own. The obvious shape for this file — a
# `location /assets/` and a `location = /index.html` that each set
# Cache-Control — would therefore silently DROP every security header set on
# the server block below, on exactly the responses a browser caches longest.
# Nothing warns; `nginx -t` passes; only a response says so.
#
# So no location in this file declares an `add_header` at all. The cache value
# is computed here, one `add_header Cache-Control` sits on the server block
# with the rest, and inheritance is never in play. Check that with `curl -I` on
# a real asset, not by reading this file.
#
# An EMPTY value makes nginx skip the header entirely. That is what keeps a
# proxied /api/ response carrying the backend's own Cache-Control rather than a
# second, contradictory one added by us.
map $uri $cache_control {
  default         '';
  ~^/assets/      'public, max-age=31536000, immutable';
  /index.html     'no-store';
  /theme-init.js  'no-store';
  /favicon.svg    'no-store';
  # Written at container start from the environment, so it changes without
  # the bundle changing: never cached.
  /runtime-config.js 'no-store';
}

# TLS terminates in front of this container (it listens on :8080 only), so
# $scheme is always "http". Pass on the terminator's X-Forwarded-Proto when it
# is a recognised value; otherwise fall back to $scheme. Safe only while
# express makes no URL or HTTPS decision from req.protocol/req.secure beyond
# express-session's Secure cookie check.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
  http    http;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # `Server: nginx`, without the version, on responses and error pages.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The query-stripping format, applied at SERVER level as well as on the SSE
  # location below — because `access_log` is only consulted once a location has
  # been SELECTED, and a request rejected before that never reaches one: a 505
  # for a bad protocol version or a 414 for an over-long URI would otherwise be
  # logged under the http-level `main` format with the query string intact.
  #
  # This is an ACTIVE protection, not merely
  # defence in depth: `location /` below falls through to `index.html` for
  # every SPA route, including `/reset-password?token=…` and
  # `/verify-email?token=…` (reset-password.tsx, verify-email.tsx) — real,
  # one-time credentials mailed to real users, served by this same `server`
  # block and logged under this same server-level format. Stripping the
  # query string here is what keeps those out of access.log, on top of
  # covering whatever a request rejected before location selection would
  # otherwise have logged in full.
  #
  # The cost is that NO request's query string is logged anywhere, including
  # harmless ones like `?page=2`. That is the right trade regardless: a query
  # string is a debugging convenience, worth losing across the board rather
  # than re-deciding, request by request, whether this one's query string
  # might matter.
  access_log /var/log/nginx/access.log stream_nolog;

  # Security headers. `always` so they are set on error responses too, not
  # only on 2xx/3xx. See the map above for why they live only here.
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # Enforced, with no inline script anywhere: the pre-paint theme script is the
  # file /theme-init.js. style-src needs 'unsafe-inline' because sonner injects
  # a <style> element at runtime. connect-src 'self' holds while /api is proxied
  # here on the same origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  # Cache-Control alone is not `always`: an error must never carry the
  # year-long immutable policy of the asset URI it failed to serve.
  add_header Cache-Control $cache_control;
  # HSTS is deliberately NOT set here: this server listens on :8080 behind a TLS
  # terminator, and a max-age sent over plain HTTP is ignored by browsers while
  # being actively wrong if this ever runs without TLS in front. Set it at the
  # edge that terminates TLS.

  # SSE. express already disables buffering per response (X-Accel-Buffering:
  # no) and pings every 30s by default; this location adds buffering off, an
  # empty Connection header, a 24h read timeout and stripped logs on top.
  #
  # It is written above `location /api/` for readability only. nginx selects the
  # LONGEST matching prefix regardless of the order locations appear in, so
  # moving this below the general block would change nothing — do not "fix" an
  # ordering bug here, because there is not one.
  #
  # The `/api/v1` prefix here is the SAME contract as `API_PREFIX` in
  # src/constants/routes.ts, which is where the bundle's copy of it lives. The
  # two cannot be derived from one another — this file is static and the
  # bundle is built — so moving the prefix means editing both in one change
  # (plus `location /api/` and the Vite proxy for a prefix outside /api).
  location /api/v1/notifications/stream {
    # No credential rides in the query string here. The route sits behind
    # `requireAuth` like every other one (notification.routes.ts,
    # express-boilerplate), and the client authenticates with an
    # `Authorization: Bearer` header, which never appears in the request line
    # nginx logs.
    #
    # The two lines below are defence in depth: stripping this location's
    # query string and silencing its upstream error detail means a query
    # parameter added here later — without anyone re-reading this comment —
    # does not quietly start writing something sensitive to disk. The client
    # hook reconnects under backoff, so anything in this URL would be logged
    # on every connect and reconnect.
    #
    # Repeats the server-level format here so this location stays stripped
    # even if the server line changes.
    access_log /var/log/nginx/access.log stream_nolog;
    # No log format can cover the ERROR log: nginx writes the full request
    # line AND the full upstream URL into every upstream error message, query
    # string included, e.g.
    # `request: "GET /api/v1/notifications/stream?… HTTP/1.1"` on a 502.
    #
    # READ THIS BEFORE DEBUGGING A FLAPPING STREAM. `crit` does not merely drop
    # "connect() failed". It silences EVERY `error`-level upstream message for
    # this location — `upstream prematurely closed connection`, `upstream timed
    # out`, `no live upstreams` included. Operationally that means you can no
    # longer tell "backend down" from "backend closed the stream" from the logs:
    # all of them surface only as a 502 or a 499 in the access log, with no
    # reason attached. That is the cost of the same defence in depth the
    # access log above is. If you need the reason, get it from the upstream's
    # own logs, or
    # raise this to `error` TEMPORARILY and remember what you are then writing
    # to disk.
    error_log /var/log/nginx/error.log crit;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    # Not "keep-alive" and not "upgrade": an empty Connection header is what
    # stops nginx passing the client's hop-by-hop value upstream and closing
    # the stream.
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  location /api/ {
    # NO trailing path on proxy_pass, and none in API_UPSTREAM either:
    # scheme://host:port, not even a bare "/". A path there makes nginx
    # REWRITE the URI (`/api/` becomes that path), so express stops matching
    # its routes.
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The terminator's X-Forwarded-Proto, passed through (see the map above).
    # express needs TRUST_PROXY set for express-session to see HTTPS through it
    # and set the Secure `oauth.sid` cookie.
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # posthog-js's events, session replay and recorder script, which express's
  # analytics proxy forwards to PostHog; the browser never talks to PostHog
  # itself, so `connect-src 'self'` and `script-src 'self'` hold. The only
  # differences from `location /api/` are the body: nginx's default 1 MB
  # answers 413 to a replay batch, which posthog-js splits only above about
  # 6.3 MB (6606028 bytes in its recorder), and base64 (`data=`, when gzip is
  # unavailable) adds a third: 10 MB covers that. Bodies are streamed to
  # express as they arrive rather than buffered under /tmp, the way express
  # streams them on to PostHog. The query string carries no PII (`ip`, `_`,
  # `ver`, `compression`), and the server-level format strips it anyway.
  location /api/v1/collect/ {
    client_max_body_size 10m;
    proxy_request_buffering off;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # The run-time configuration docker/10-runtime-config.sh writes at start
  # (the root filesystem is read-only, so it lives under /tmp). index.html
  # loads it before the bundle. Same-origin, so `script-src 'self'` covers it;
  # Cache-Control comes from the map above. Like every location here, no
  # add_header.
  location = /runtime-config.js {
    alias /tmp/runtime/runtime-config.js;
  }

  # A missing hashed asset is a real 404, not index.html with a 200: a page
  # still asking for a chunk a deploy removed then fails at the request rather
  # than parsing HTML as JavaScript. Like every location here, no add_header.
  location /assets/ {
    try_files $uri =404;
  }

  # The image build deletes its source maps; this keeps one from being served
  # if a deploy ever copies dist/ without that step. A regex location is tried
  # after the longest prefix match and wins over it, unless the prefix is
  # `^~`: `/assets/` above is not, so /assets/x.js.map is a 404 here even when
  # the file exists. /api/ is left out so a proxied path ending in .map is
  # still the API's to answer. Like every location here, no add_header.
  location ~* ^(?!/api/).+\.map$ {
    return 404;
  }

  location / {
    # The SPA fallback. After the internal redirect, $uri is /index.html, so
    # the map above gives every client-side route `no-store` — a cached
    # index.html is how a deploy leaves browsers asking for asset hashes that
    # no longer exist.
    try_files $uri /index.html;
  }
}
