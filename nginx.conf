# The container's only server block, as a template. The Dockerfile copies it to
# /etc/nginx/templates/default.conf.template and the image's entrypoint renders
# it with envsubst into /tmp/nginx/conf.d/default.conf on every start, so the
# root filesystem can stay read-only. NGINX_ENVSUBST_FILTER in the Dockerfile
# limits envsubst to API_UPSTREAM, so nginx's own variables pass through.
# An added placeholder needs that filter widened too: unrendered, `${NAME}` reads
# as an nginx variable and `nginx -t` fails with `unknown "NAME" variable`.
#
# docker/nginx.main.conf includes the rendered file inside `http { }`, so
# `log_format` and `map` are legal at the top of this file and `server` sits
# directly in `http`.

# The URI after any internal redirect, without its query string (`$uri`, not
# `$request`). Used by the server-level and the SSE-location `access_log` lines below.
log_format stream_nolog '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

# The cache policy, chosen by URI here instead of by a per-location `add_header`.
#
# `add_header` does not inherit into a location that declares any `add_header`
# of its own. A `location /assets/` and a `location = /index.html` that each set
# Cache-Control would therefore drop every security header set on the server
# block, on the responses a browser caches longest. Nothing warns and `nginx -t`
# passes. So no location in this file declares an `add_header`: the value is
# computed here and one `add_header Cache-Control` sits on the server block with
# the rest. Check with `curl -I` on a real asset.
#
# An EMPTY value makes nginx skip the header, which leaves a proxied /api/
# response with the backend's own Cache-Control and not a second, contradictory one.
map $uri $cache_control {
  default         '';
  ~^/assets/      'public, max-age=31536000, immutable';
  /index.html     'no-store';
  /theme-init.js  'no-store';
  /boot-variant.js 'no-store';
  /favicon.svg    'no-store';
  # Written at container start from the environment, so it can change without rebuilding the bundle.
  /runtime-config.js 'no-store';
}

# Each security header below is sent only when the response does not already
# carry its own. A proxied /api/ response carries express's (helmet's
# `X-Frame-Options: SAMEORIGIN`, a `default-src 'none'` CSP and the rest), and
# adding this file's as well would send two of each: two
# `Cross-Origin-Opener-Policy` lines do not parse, so COOP falls back to
# `unsafe-none`. The key is the upstream's own header, not `/api/`, so nginx's
# own 502 or 504 for an /api/ request still carries the full set. An EMPTY value
# skips the header (see the cache map). `proxy_hide_header` would instead
# replace helmet's stricter API values with this file's page values.
map $upstream_http_referrer_policy $referrer_policy {
  ''      'no-referrer';
  default '';
}
map $upstream_http_x_content_type_options $x_content_type_options {
  ''      'nosniff';
  default '';
}
map $upstream_http_x_frame_options $x_frame_options {
  ''      'DENY';
  default '';
}
map $upstream_http_cross_origin_opener_policy $cross_origin_opener_policy {
  ''      'same-origin';
  default '';
}
map $upstream_http_permissions_policy $permissions_policy {
  ''      'camera=(), microphone=(), geolocation=(), payment=(), usb=()';
  default '';
}
# script-src 'self' holds because no script is inline: the pre-paint scripts
# are the files /theme-init.js and /boot-variant.js. style-src needs 'unsafe-inline' because
# Base UI's Select popup renders a <style> element and index.html's boot shell is
# inline CSS. connect-src 'self' holds
# because /api is proxied on the same origin.
map $upstream_http_content_security_policy $content_security_policy {
  ''      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
  default '';
}

# TLS terminates in front of this container, which listens on :8080 only, so
# $scheme is always "http". Pass the terminator's X-Forwarded-Proto on when it
# is "http" or "https"; otherwise fall back to $scheme. Safe only while express
# makes no URL or HTTPS decision from req.protocol or req.secure beyond
# express-session's Secure cookie check (its analytics proxy only forwards the
# scheme to PostHog).
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
  http    http;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The query-stripping format is set at server level, not only on the SSE
  # location, because a request rejected before a location is selected (a 505
  # for a bad protocol version, a 414 for an over-long URI) is logged with the
  # server-level setting, which would otherwise be the http-level `main` format
  # with the query string intact.
  #
  # This is active protection, not only defence in depth: `location /` falls
  # back to `index.html` for every SPA route, including `/reset-password?token=…`
  # and `/verify-email?token=…` (reset-password.tsx, verify-email.tsx), whose
  # tokens are credentials mailed to users. Stripping the query string keeps
  # them out of access.log, and `Referrer-Policy: no-referrer` keeps the page's
  # URL out of the logged `$http_referer`.
  #
  # The cost is that no request's query string reaches the access log, harmless
  # ones like `?page=2` included. That is cheaper than deciding per request
  # whether a query string might matter.
  access_log /var/log/nginx/access.log stream_nolog;

  # `always` sets the security headers on error responses too, not only on
  # 2xx/3xx. The cache map says why they live only here, and the security-header
  # maps say why a proxied response keeps its own.
  add_header Referrer-Policy $referrer_policy always;
  add_header X-Content-Type-Options $x_content_type_options always;
  add_header X-Frame-Options $x_frame_options always;
  add_header Cross-Origin-Opener-Policy $cross_origin_opener_policy always;
  add_header Permissions-Policy $permissions_policy always;
  add_header Content-Security-Policy $content_security_policy always;
  # Not `always`: an error must never carry the year-long immutable policy of
  # the asset URI it failed to serve.
  add_header Cache-Control $cache_control;
  # No HSTS here: whether TLS fronts this container, and which hosts the policy
  # covers, is the TLS edge's to decide. Set it there.

  # SSE. express already sets `X-Accel-Buffering: no` on the stream and pings
  # every 30s by default; this location also turns buffering off, empties the
  # Connection header, raises the read timeout to 24h and keeps the query string
  # out of the logs.
  #
  # It sits above `location /api/` for readability only: nginx selects the
  # longest matching prefix whatever the order, so there is no ordering bug to fix
  # by moving it.
  #
  # The `/api/v1` prefix is the same contract as `API_PREFIX` in
  # src/constants/routes.ts. This file is static and the bundle is built, so
  # neither can be derived from the other: moving the prefix means editing both
  # in one change, plus `location /api/v1/collect/` (and `location /api/` and the
  # Vite proxy for a prefix outside /api).
  location /api/v1/notifications/stream {
    # No credential rides in the query string: the client authenticates with an
    # `Authorization: Bearer` header (the route sits behind `requireAuth`, like
    # every other one in notification.routes.ts of express-boilerplate), and the
    # header never appears in the request line nginx logs.
    #
    # The access_log and error_log lines below are defence in depth: they keep
    # a query parameter added here later, without anyone re-reading this
    # comment, from quietly writing something sensitive to disk. The client
    # hook reconnects under backoff, so anything in this URL would be logged on
    # every connect and reconnect.
    #
    # The format is repeated here so this location stays stripped even if the
    # server-level line changes.
    access_log /var/log/nginx/access.log stream_nolog;
    # No log format reaches the ERROR log: nginx writes the full request line and
    # upstream URL, query string included, into every upstream error message,
    # e.g. `request: "GET /api/v1/notifications/stream?… HTTP/1.1"` on a 502.
    #
    # Read this before debugging a flapping stream. `crit` silences every
    # `error`-level upstream message for this location, not only "connect()
    # failed": `upstream prematurely closed connection`, `upstream timed out`
    # and `no live upstreams` go too. "Backend down" and "backend closed the
    # stream" then look the same in the logs, a bare status in the access log
    # with no reason. Get the reason from the upstream's own logs, or raise this
    # to `error` temporarily, knowing it writes the query string to disk.
    error_log /var/log/nginx/error.log crit;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    # nginx sends `Connection: close` upstream by default; an empty value omits it.
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  # Google's redirect lands here with `code` and `state` in the query string, and
  # nginx writes the whole request line into every upstream error message, at the
  # `error` level. `crit` silences those messages for this route only, the same
  # trade as the stream's location: the reason for an upstream failure here is in
  # express's logs. The other directives are `location /api/`'s; change both
  # together (tests/unit/docker/nginx-conf.test.ts compares them).
  # docker/check-image.sh proves the callback's query stays out of the log while
  # another /api/ path still logs its error.
  #
  # A regex, not `=`: express routes without strict slashes and ignores case, so
  # `/callback/` and `/Api/V1/Auth/Google/Callback` reach the same handler and
  # must not log either. A regex location is tried after the longest prefix
  # match and wins over it unless that prefix is `^~`; `location /api/` is not,
  # so making it `^~` would silently disable this location. `~*` also matches an
  # uppercase `/API/`, which this location proxies where `location /` would serve
  # index.html; express answers it as the callback anyway.
  location ~* ^/api/v1/auth/google/callback/?$ {
    error_log /var/log/nginx/error.log crit;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /api/ {
    # No path on proxy_pass or in API_UPSTREAM: scheme://host:port, not even a
    # bare "/". A path there makes nginx rewrite the URI (the matched `/api/`
    # becomes that path), so express stops matching its routes.
    #
    # An upstream error here logs the request line, query string included; the
    # Google OAuth callback has its own location above to keep its query out.
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The terminator's X-Forwarded-Proto (see the map above). express needs
    # TRUST_PROXY set for express-session to see HTTPS through it and send the
    # Secure OAuth session cookie.
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # posthog-js's events, session replay and recorder script, which express's
  # analytics proxy forwards to PostHog; the browser never talks to PostHog
  # itself, so `connect-src 'self'` and `script-src 'self'` hold. The only
  # differences from `location /api/` concern the request body. nginx's default
  # 1 MB answers 413 to a replay batch, which posthog-js splits only above about
  # 6.3 MiB (6606028 bytes), and base64 (`data=`, used when gzip is unavailable)
  # adds a third: 10 MB covers that. The body streams to express as it arrives
  # instead of being buffered under /tmp, as express streams it on to PostHog.
  # The query string holds transport parameters such as `compression`, and the
  # server-level format strips it anyway.
  location /api/v1/collect/ {
    client_max_body_size 10m;
    proxy_request_buffering off;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # The run-time configuration docker/10-runtime-config.sh writes at start; it
  # lives under /tmp because the root filesystem is read-only. index.html loads
  # it before the bundle. Same-origin, so `script-src 'self'` covers it, and its
  # Cache-Control comes from the cache map.
  location = /runtime-config.js {
    alias /tmp/runtime/runtime-config.js;
  }

  # A missing hashed asset is a real 404, not index.html with a 200: a page
  # still asking for a chunk a deploy removed then fails at the request rather
  # than parsing HTML as JavaScript.
  location /assets/ {
    try_files $uri =404;
  }

  # The image build deletes its source maps; this keeps one from being served
  # if a deploy ever copies dist/ without that step. A regex location is tried
  # after the longest prefix match and wins over it unless that prefix is `^~`.
  # `/assets/` is not, so /assets/x.js.map is a 404 here even when the file
  # exists. /api/ is excluded so a proxied path ending in .map is still the
  # API's to answer.
  location ~* ^(?!/api/).+\.map$ {
    return 404;
  }

  location / {
    # The SPA fallback. After the internal redirect $uri is /index.html, so the
    # cache map gives every client-side route `no-store`: a cached index.html is
    # how a deploy leaves browsers asking for asset hashes it removed.
    try_files $uri /index.html;
  }
}
